name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name e.g. v0.1.0"
        required: true
        default: "v0.1.0"
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/generate-data
      - name: Fetch emoji data and font
        run: |
          python3 -m unittest discover -s tools/data/emoji -p "test_*.py"
          python3 tools/data/emoji/fetch_emoji.py feature-emoji/src/main/assets/emoji
          python3 scripts/check-emoji-data.py
      - name: Decode keystore
        if: env.HAS_KEYSTORE_SECRET == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
      - name: Check lines, comments, binaries and functions
        run: |
          bash scripts/check-all.sh
      - name: Merge manifests
        run: bash scripts/gradle-retry.sh :app:processDebugMainManifest :app:processReleaseMainManifest --no-daemon
      - name: Check merged manifest
        run: bash scripts/check-merged-manifest.sh
      - name: Lint
        run: bash scripts/gradle-retry.sh :app:lintRelease --no-daemon
      - name: Unit tests
        run: bash scripts/gradle-retry.sh :core:testDebugUnitTest :feature-symbols:testDebugUnitTest :feature-emoji:testDebugUnitTest :feature-decorate:testDebugUnitTest :feature-clipboard:testDebugUnitTest :feature-translate:testDebugUnitTest :feature-autofix:testDebugUnitTest :feature-images:testDebugUnitTest --no-daemon
      - name: Require signing configuration
        run: |
          test "${HAS_KEYSTORE:-}" = "true"
          test -n "${KEYSTORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Assemble signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRANSLATE_URL: ${{ secrets.TRANSLATE_URL }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: bash scripts/gradle-retry.sh :app:assembleRelease --no-daemon
      - name: Check 16KB APK alignment
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            bash scripts/check-alignment.sh "$apk"
          done
      - name: Check APK permissions
        run: bash scripts/check-apk-permissions.sh
      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} dist/ \;
          (cd dist && sha256sum *.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Space Keyboard ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
